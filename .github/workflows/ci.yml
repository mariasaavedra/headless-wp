name: CI

on:
  push:
    branches: [main]
  pull_request:

# A run is only useful against the latest commit of a branch; cancel the rest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: Platform CLE smoke tests
    # Defined in its own callable workflow so the plugin deploy can require
    # the very same job instead of a second copy of it.
    uses: ./.github/workflows/smoke-tests.yml

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build
        # The app reads the WordPress API at request time, not at build time,
        # so a placeholder is enough to satisfy the env check here.
        env:
          WORDPRESS_API_URL: http://localhost:8080/wp-json
        run: npm run build

  e2e:
    name: Web end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Against a real WordPress, because what these tests check is precisely
    # what depends on it: who you are, what you are offered, and what happens
    # when you enrol someone. A mocked backend would assert the mock.
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/start-wordpress

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run the suite
        env:
          # The app talks to the stack this job just started; the tests
          # arrange their fixtures through the same API.
          WORDPRESS_API_URL: http://localhost:8080/wp-json
          WORDPRESS_SITE_URL: http://localhost:8080
        run: npm run test:e2e --workspace=apps/web

      - name: Traces and screenshots from whatever failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
