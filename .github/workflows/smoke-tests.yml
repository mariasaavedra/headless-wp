name: Smoke tests

# The Platform CLE suite, against a real WordPress rather than mocks: brings
# up WordPress and MySQL, waits for the plugin to answer, runs the suite.
#
# Callable so that CI and the plugin deploy run the same job rather than two
# copies of it that drift apart. Nothing triggers it on its own.
on:
  workflow_call:

jobs:
  smoke-tests:
    name: Platform CLE smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/start-wordpress

      - name: Run the smoke tests
        run: |
          docker compose exec -T wordpress \
            php /var/www/html/wp-content/plugins/platform-cle/tests/smoke-test.php

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
